<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Traffic Camera Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hud-label { background: rgba(0, 0, 0, 0.85); color: #00ffcc; font-family: monospace; }
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800 bg-slate-950 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-camera-radar text-cyan-400 text-2xl animate-pulse"></i>
                <h1 class="text-xl font-bold tracking-wider">AI TRAFFIC VISION <span class="text-xs bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded-full border border-cyan-500/30">ONLINE</span></h1>
            </div>
            <div id="server-status" class="flex items-center space-x-2 text-sm bg-slate-800 px-3 py-1.5 rounded-lg text-rose-400">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                <span id="status-text">সার্ভার অফলাইন</span>
            </div>
        </div>
    </header>

    <main class="flex-1 relative bg-black flex items-center justify-center overflow-hidden aspect-video max-w-4xl mx-auto w-full rounded-2xl my-4 border border-slate-800 shadow-2xl">
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
        <canvas id="canvas" class="hidden"></canvas>
        
        <div id="camera-placeholder" class="text-center p-6 space-y-4 z-10">
            <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto border border-slate-700">
                <i class="fa-solid fa-video-slash text-slate-500 text-3xl"></i>
            </div>
            <p class="text-slate-400 max-w-sm">লাইভ এআই ট্র্যাকিং শুরু করতে নিচের বাটনে ক্লিক করুন।</p>
        </div>

        <div id="ai-box" class="absolute border-2 border-cyan-400 shadow-[0_0_15px_#00ffcc] hidden pointer-events-none transition-all duration-300">
            <div class="hud-label absolute -top-24 left-0 p-2 rounded text-xs space-y-0.5 whitespace-nowrap border border-cyan-500/30---">
                <div id="box-type" class="text-amber-400 font-bold"></div>
                <div id="box-speed"></div>
                <div id="box-plate"></div>
            </div>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto w-full p-4 grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-950 border-t border-slate-800 rounded-t-2xl">
        <div class="md:col-span-2 flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <button id="start-btn" onclick="startSystem()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-6 py-3 rounded-lg transition flex items-center space-x-2 cursor-pointer active:scale-95">
                <i class="fa-solid fa-power-off"></i> <span>সিস্টেম চালু করুন</span>
            </button>
            <button id="stop-btn" onclick="stopSystem()" class="bg-slate-800 hover:bg-slate-700 text-rose-400 font-medium px-6 py-3 rounded-lg transition flex items-center space-x-2 cursor-pointer active:scale-95 hidden">
                <i class="fa-solid fa-stop"></i> <span>বন্ধ করুন</span>
            </button>
            <div class="text-xs text-slate-500 font-mono">FPS: <span class="text-cyan-400">30</span></div>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
            <div>
                <span class="text-slate-400 text-xs block">সর্বশেষ প্লেট:</span>
                <span id="last-plate" class="font-mono bg-white text-black px-1.5 py-0.5 rounded font-bold">---</span>
            </div>
            <div class="text-right">
                <span class="text-slate-400 text-xs block">গতিসীমা:</span>
                <span id="last-speed" class="font-bold text-cyan-400 text-base">-- KM/H</span>
            </div>
        </div>
    </footer>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const aiBox = document.getElementById('ai-box');
        let socket;
        let frameInterval;
        let isSystemRunning = false;

        // আপনার সঠিক Render অনলাইন সার্ভার লিংকটি এখানে যুক্ত করা হয়েছে
        const SERVER_URL = "wss://ai-camera-backend-nk79.onrender.com/ws/traffic-vision"; 

        async function startSystem() {
            try {
                isSystemRunning = true;
                const constraints = { 
                    video: { 
                        facingMode: { ideal: "environment" }, // পিছনের মেইন ক্যামেরা
                        width: { ideal: 640 }, 
                        height: { ideal: 480 } 
                    },
                    audio: false 
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('camera-placeholder').classList.add('hidden');
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('stop-btn').classList.remove('hidden');

                initWebSocket();
            } catch (err) {
                alert("ক্যামেরা অন করা যায়নি! আপনার ব্রাউজার সেটিংসে গিয়ে ক্যামেরার পারমিশন 'Allow' করে দিন। (অবশ্যই Chrome ব্রাউজার ব্যবহার করুন)");
                isSystemRunning = false;
            }
        }

        function initWebSocket() {
            if (!isSystemRunning) return;

            document.getElementById('status-text').innerText = "সার্ভারে কানেক্ট হচ্ছে (দয়া করে অপেক্ষা করুন)...";
            document.getElementById('server-status').className = "flex items-center space-x-2 text-sm bg-slate-800 px-3 py-1.5 rounded-lg text-amber-400";

            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                document.getElementById('server-status').className = "flex items-center space-x-2 text-sm bg-slate-800 px-3 py-1.5 rounded-lg text-emerald-400";
                document.getElementById('server-status').innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span><span id="status-text">সার্ভার অনলাইন</span>';
                
                // প্রতি ১.৫ সেকেন্ড পর পর ক্যামেরার ফ্রেম ব্যাক-এন্ডে পাঠানো
                clearInterval(frameInterval);
                frameInterval = setInterval(sendFrame, 1500);
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateUI(data);
            };

            socket.onclose = () => {
                clearInterval(frameInterval);
                if (isSystemRunning) {
                    // সার্ভার ঘুমন্ত থাকলে প্রতি ৩ সেকেন্ড পর পর স্বয়ংক্রিয়ভাবে আবার কানেক্ট করার চেষ্টা করবে
                    document.getElementById('status-text').innerText = "সার্ভার রি-কানেক্ট হচ্ছে...";
                    document.getElementById('server-status').className = "flex items-center space-x-2 text-sm bg-slate-800 px-3 py-1.5 rounded-lg text-amber-500 animate-pulse";
                    setTimeout(initWebSocket, 3000); 
                }
            };
            
            socket.onerror = () => {
                socket.close();
            };
        }

        function sendFrame() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                const ctx = canvas.getContext('2d');
                canvas.width = 160; 
                canvas.height = 120;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                socket.send(canvas.toDataURL('image/jpeg', 0.3)); 
            }
        }

        function updateUI(data) {
            aiBox.style.left = data.box.left + "%";
            aiBox.style.top = data.box.top + "%";
            aiBox.style.width = data.box.width + "%";
            aiBox.style.height = data.box.height + "%";
            aiBox.classList.remove('hidden');

            if(data.is_overspeed) {
                aiBox.style.borderColor = '#f43f5e';
                aiBox.style.boxShadow = '0 0 15px #f43f5e';
            } else {
                aiBox.style.borderColor = '#22d3ee';
                aiBox.style.boxShadow = '0 0 15px #22d3ee';
            }

            document.getElementById('box-type').innerText = `🚗 ${data.vehicle_type.toUpperCase()}`;
            document.getElementById('box-speed').innerHTML = `স্পিড: <span class="${data.is_overspeed ? 'text-rose-500 font-bold':'text-emerald-400'}">${data.speed} KM/H</span>`;
            document.getElementById('box-plate').innerHTML = `প্লেট: <span class="bg-white text-black px-1 rounded font-bold text-[10px]">${data.plate}</span>`;

            document.getElementById('last-plate').innerText = data.plate;
            const speedEl = document.getElementById('last-speed');
            speedEl.innerText = `${data.speed} KM/H`;
            speedEl.className = `font-bold text-base ${data.is_overspeed ? 'text-rose-500':'text-emerald-400'}`;
        }

        function stopSystem() {
            isSystemRunning = false;
            clearInterval(frameInterval);
            if (socket) socket.close();
            if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
            
            video.classList.add('hidden');
            aiBox.classList.add('hidden');
            document.getElementById('camera-placeholder').classList.remove('hidden');
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('stop-btn').classList.add('hidden');
            document.getElementById('server-status').className = "flex items-center space-x-2 text-sm bg-slate-800 px-3 py-1.5 rounded-lg text-rose-400";
            document.getElementById('server-status').innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span><span id="status-text">সার্ভার অফলাইন</span>';
        }
    </script>
</body>
</html>
